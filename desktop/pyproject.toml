[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "posturepal"
version = "0.2.0"
description = "PosturePal native Python desktop prototype"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "bleak>=3,<4"]

[project.scripts]
posturepal = "posturepal.app:main"

[tool.setuptools.packages.find]
include = ["posturepal*"]
